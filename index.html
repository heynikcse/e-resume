<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="shortcut icon" href="img/" type="image/x-icon">

  <!-- remixicons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

  <!-- css file -->
  <link rel="stylesheet" href="css/styles.css">

  <title>Resume-Portfolio</title>
</head>
<body>

  <!-- main -->
   <main class="main">
    <div class="main__content">

      <section class="profile section">
        <div class="profile__container container grid">
          <div class="profile__image">
            <img src="img/" alt="" class="profile__img">
          </div>

          <div class="profile__data">
            <h3 class="profile__greeting"></h3>
            <h1 class="profile__name"></h1>
          </div>
        </div>
      </section>

      <div class="main__area">
        <div class="main__group main-active" data-content id="info">
          <div class="main__left">
          </div>

          <div class="main__right">
          </div>
        </div>

        <section class="projects section" data-content id="projects">

        </section>
      </div>
    </div>
   </main>


  <script></script>

  <!-- main js file -->
  <script src="js/main.js"></script>

</body>
</html>
